# *********************************
# * Parameters for metqc pipeline *
# *********************************
# Run by Daniel on April 15th, 2026

# List of files
#list_files: "list_files.txt"
list_files: "list_3_files.txt"

# Input directory Path to raw sequences
input_dir: "/bulk/sycuro_bulk/shared_projects/parkinsons/Vancouver_PD92/raw_data"

# Output directory path for output files.
#output_dir: "/bulk/sycuro_bulk/ayman/PD_vancouver_92/metqc/output"
output_dir: "/bulk/sycuro_bulk/output_test"

# Suffix for forward reads.
forward_read_suffix: "_R1.fastq"

# Suffix for reverse reads.
reverse_read_suffix: "_R2.fastq"

# Run fastqc and multiqc only
qc_only: FALSE

## bbmap suite parameters 
#
# The number of cpu cores to use
num_cpus: 20


### Prinseq parameters
trimleft: 0
trimright: 0
trim_qual_left: 30
trim_qual_right: 30
trim_qual_window: 10
trim_qual_step : 2
trim_qual_type: "mean"
trim_qual_rule: "lt"
lc_method: "dust"
lc_threshold: 7

# Minimum length for reads
minlength: 60

# Maximum number of N bases allowed
maxn: 15

### BMtagger Parameters

# Choose whether to run bmtagger
run_bmtagger: TRUE

# Index for bmfilter (part of bmtagger), bitmask file
bmfilter_ref: "/bulk/IMCshared_bulk/shared/dbs/bmtaggerDB_hg19/hg19_rRNA_mito_Hsapiens_rna/hg19_rRNA_mito_Hsapiens_rna_reference.bitmask"

# Index for srprism (part of bmtagger)
srprism_ref: "/bulk/IMCshared_bulk/shared/dbs/bmtaggerDB_hg19/hg19_rRNA_mito_Hsapiens_rna/hg19_rRNA_mito_Hsapiens_rna_reference.srprism"

### BBMap parameters
# Choose whether to run bbmap
run_bbmap: FALSE

# Path and name of reference fasta for bbmap
bbmap_ref: "/home/aschick/refs/hs37.fa"
bbmap_ref_ind: "/bulk/IMCshared_bulk/shared/dbs/bbmapDB/bbmap_GRCh38.p14/"
